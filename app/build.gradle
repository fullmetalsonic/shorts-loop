plugins { id 'com.android.application' }
android {
    namespace 'com.fullmetalsonic.shortsloop'
    compileSdk 35
    defaultConfig {
        applicationId 'com.fullmetalsonic.shortsloop'
        minSdk 26
        targetSdk 35
        // Explicit local bootstrap is used only to test a real OS update to the final higher code.
        versionCode providers.gradleProperty('updaterBootstrap').isPresent() ? 15 : 31
        versionName providers.gradleProperty('updaterBootstrap').isPresent() ? '0.2.5-update-test' : '0.2.9'
        testInstrumentationRunner providers.gradleProperty('updaterBootstrap').isPresent()
                ? 'com.fullmetalsonic.shortsloop.updates.UpdateInstallInstrumentation'
                : 'com.fullmetalsonic.shortsloop.CompatibilityInstrumentation'
    }
    buildFeatures { buildConfig true }
    // Local signing only. CI builds an unsigned release; no key or password belongs in source.
    def releaseStore = providers.environmentVariable('SHORTSLOOP_KEYSTORE').orNull
    signingConfigs {
        if (releaseStore) {
            distribution {
                storeFile file(releaseStore)
                storePassword providers.environmentVariable('SHORTSLOOP_STORE_PASSWORD').get()
                keyAlias providers.environmentVariable('SHORTSLOOP_KEY_ALIAS').get()
                keyPassword providers.environmentVariable('SHORTSLOOP_KEY_PASSWORD').get()
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            minifyEnabled false
            if (releaseStore) signingConfig signingConfigs.distribution
        }
    }
    // Preserve the unfinished, unconnected experiment in source, but not in the product APK/tests.
    // Run its full (currently failing) suite separately with scripts/verify-sequence-experiment.ps1.
    sourceSets {
        main.java.exclude 'com/fullmetalsonic/shortsloop/core/VisualSequenceTracker.java'
        test.java.exclude 'com/fullmetalsonic/shortsloop/core/VisualSequenceTrackerTest.java'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true; checkReleaseBuilds true }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
